<header>
  <nav id="navbar" class="navbar navbar-light navbar-expand-sm {% if site.navbar_fixed %}fixed-top{% else %}sticky-top{% endif %}">
    <div class="container">
      <a class="navbar-brand title font-weight-lighter" href="{{ '/' | relative_url }}">
        <span class="font-weight-bold">{{ site.first_name }}</span> {{ site.last_name }}
      </a>

      <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar top-bar"></span>
        <span class="icon-bar middle-bar"></span>
        <span class="icon-bar bottom-bar"></span>
      </button>

      <div class="collapse navbar-collapse text-right" id="navbarNav">
        <ul class="navbar-nav ml-auto flex-nowrap">
          <li class="nav-item {% if page.url == '/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/' | relative_url }}">Home</a>
          </li>
          <li class="nav-item {% if page.url contains '/experience/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/experience/' | relative_url }}">Experience</a>
          </li>
          <li class="nav-item {% if page.url contains '/projects/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/projects/' | relative_url }}">Projects</a>
          </li>
          <li class="nav-item {% if page.url contains '/publications/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/publications/' | relative_url }}">Publications</a>
          </li>
          <li class="nav-item {% if page.url contains '/about/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/about/' | relative_url }}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/assets/Sobhan_CV.pdf' | relative_url }}">CV</a>
          </li>
          {% if site.enable_darkmode %}
          <div class="toggle-container">
            <a id="light-toggle" aria-label="Toggle dark mode">
              <i class="fas fa-moon"></i>
              <i class="fas fa-sun"></i>
            </a>
          </div>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
